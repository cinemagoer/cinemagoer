name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Build translations
        run: >-
          uv run --no-default-groups --group test
          python rebuildmo.py

      - name: Verify the base dependency boundary
        run: >-
          uv run --no-default-groups --group test python -c
          "import importlib.util;
          assert importlib.util.find_spec('sqlalchemy') is None"

      - name: Run tests
        run: uv run --no-default-groups --group test pytest

  quality:
    name: Ruff, coverage, documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install tox without optional database dependencies
        run: uv sync --locked --no-default-groups --group tox

      - name: Run required quality gates
        run: >-
          uv run --no-default-groups --group tox
          tox run -e coverage,style,docs

  distributions:
    name: Verify built distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install distribution metadata checker
        run: uv sync --locked --no-default-groups --group package

      - name: Build source distribution
        run: uv build --sdist --out-dir dist

      - name: Build wheels from the repository and sdist
        run: |
          uv build --wheel --out-dir dist/direct .
          uv build --wheel --out-dir dist/from-sdist dist/*.tar.gz

      - name: Check distribution metadata
        run: >-
          uv run --no-default-groups --group package
          twine check --strict
          dist/*.tar.gz
          dist/direct/*.whl
          dist/from-sdist/*.whl

      - name: Run the test suite from the sdist
        run: |
          mkdir -p dist/sdist-tree
          tar -xzf dist/*.tar.gz --strip-components=1 -C dist/sdist-tree
          uv run --project dist/sdist-tree --no-default-groups --group test pytest

      - name: Verify installed artifacts
        run: >-
          uv run --no-project python tools/verify_distributions.py
          --sdist dist/*.tar.gz
          --wheel dist/direct/*.whl
          --wheel dist/from-sdist/*.whl
