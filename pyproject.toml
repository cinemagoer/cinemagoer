[project]
name = "cinemagoer"
version = "2026.08.23"
description = "Retrieve data from IMDb."
readme = "README.rst"

authors = [
    {name = "Davide Alberani", email = "da@mimante.net"},
    {name = "H. Turgut Uyar", email = "uyar@tekir.org"},
]
license = {file = "LICENSE.txt"}

keywords = [
    "imdb",
    "movie",
    "cinema",
    "film",
    "cast",
    "actor",
    "actress",
    "director",
    "character",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Natural Language :: English",
    "Natural Language :: Italian",
    "Natural Language :: Turkish",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sqlalchemy = [
    "sqlalchemy>=2.0.51,<2.1",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
style = [
    "ruff>=0.15.22",
]
doc = [
    "sphinx>=8.1.3,<9",
    "sphinx-rtd-theme>=3.1.0",
]
tox = [
    "tox-uv>=1.35.2",
]
dev = [
    {include-group = "test"},
    {include-group = "style"},
    {include-group = "doc"},
    {include-group = "tox"},
    "sqlalchemy>=2.0.51,<2.1",
]

[project.urls]
homepage = "https://cinemagoer.github.io/"
documentation = "https://cinemagoer.readthedocs.io/"
repository = "https://github.com/cinemagoer/cinemagoer"

[project.scripts]
cinemagoer = "imdb.cli:main"

[tool.setuptools]
include-package-data = false
script-files = [
    "bin/cinemagoer-cli",
    "bin/s32cinemagoer.py",
    "bin/download-from-s3",
    "bin/s3-reduce",
]

[tool.setuptools.packages.find]
include = ["imdb", "imdb.*"]
namespaces = false

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.setuptools.package-data]
"imdb.locale" =  [
    "imdbpy.pot",
    "imdbpy-*.po",
    "*/LC_MESSAGES/imdbpy.mo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source_pkgs = ["imdb"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["A", "E", "F", "I", "T", "W"]
ignore = ["E501", "E731"]
exclude = []

[tool.ruff.lint.per-file-ignores]
"imdb/cli.py" = ["T201"]
"tools/verify_distributions.py" = ["T201"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py3{10,11,12,13,14}, coverage, style, docs
isolated_build = true

[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
dependency_groups = test
commands =
    pytest

[testenv:coverage]
commands =
    pytest --cov --cov-report=term-missing

[testenv:style]
package = skip
dependency_groups = style
commands =
    ruff check --preview imdb tests build_support.py rebuildmo.py tools

[testenv:docs]
changedir = docs/
dependency_groups = doc
commands =
    sphinx-build -W --keep-going -b html ./ _build/
"""

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
